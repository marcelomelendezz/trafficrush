<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nebulosa Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --space: #0a0520;
  --nebula: #1a0a3a;
  --energy: #00ddff;
  --gold: #ffd700;
  --ship: #4488ff;
  --enemy: #ff3366;
  --bg: #05030a;
}
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
body {
  background:var(--bg);
  display:flex; flex-direction:column; align-items:center;
  min-height:100vh; overflow:hidden; user-select:none;
  font-family:'Boogaloo',cursive;
}
header {
  width:100%; max-width:420px;
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 14px 6px;
  border-bottom:2px solid rgba(0,221,255,0.2);
  flex-shrink:0;
}
.logo { font-size:1.5rem; letter-spacing:0.08em; color:var(--gold);
  text-shadow:2px 2px 0 rgba(0,0,0,0.5); line-height:1; }
.logo-sub { font-family:'Share Tech Mono',monospace; font-size:0.38rem;
  letter-spacing:0.2em; color:rgba(0,221,255,0.4); display:block; }
.hud { display:flex; gap:10px; }
.hud-box { text-align:center; background:rgba(0,0,0,0.3);
  border:1px solid rgba(0,221,255,0.2); padding:3px 10px; }
.hud-label { font-family:'Share Tech Mono',monospace; font-size:0.35rem;
  letter-spacing:0.15em; color:rgba(0,221,255,0.4); display:block; }
.hud-val { font-size:1.2rem; color:var(--gold);
  text-shadow:0 0 8px rgba(255,215,0,0.4); display:block; }
#canvas-wrap { position:relative; flex-shrink:0; }
canvas { display:block; }

/* Overlay */
#overlay { position:absolute; inset:0;
  background:rgba(5,3,10,0.92); backdrop-filter:blur(5px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:20; }
#overlay.hidden { display:none; }
.ov-icon { font-size:3rem; margin-bottom:8px;
  filter:drop-shadow(0 0 12px rgba(0,221,255,0.5)); }
.ov-title { font-size:2.5rem; letter-spacing:0.1em; color:var(--gold);
  text-shadow:3px 3px 0 rgba(0,0,0,0.5); margin-bottom:2px; }
.ov-sub { font-family:'Share Tech Mono',monospace; font-size:0.44rem;
  letter-spacing:0.2em; color:rgba(0,221,255,0.4); margin-bottom:18px; }
.ov-stats { display:none; gap:14px; margin-bottom:18px; }
.ov-stats.show { display:flex; }
.ov-stat { background:rgba(0,0,0,0.4); border:1px solid rgba(0,221,255,0.2);
  padding:8px 16px; text-align:center; }
.ov-stat-num { font-size:1.8rem; color:var(--gold);
  text-shadow:0 0 10px rgba(255,215,0,0.4); display:block; }
.ov-stat-label { font-family:'Share Tech Mono',monospace;
  font-size:0.38rem; letter-spacing:0.12em; color:rgba(0,221,255,0.4); }
.ov-btn { font-family:'Boogaloo',cursive; font-size:1.1rem; letter-spacing:0.12em;
  background:var(--gold); border:none; color:#05030a;
  padding:11px 30px; cursor:pointer;
  box-shadow:3px 3px 0 rgba(0,0,0,0.4);
  transition:all 0.1s; }
.ov-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,0.4); }
.ov-hint { font-family:'Share Tech Mono',monospace; font-size:0.4rem;
  letter-spacing:0.15em; color:rgba(100,100,120,0.8); margin-top:10px; }

/* Mobile controls */
#controls {
  width:100%; max-width:420px;
  display:flex; align-items:center; justify-content:center;
  padding:8px 14px 10px; gap:10px; flex-shrink:0;
}
.ctrl-btn {
  font-size:1.4rem; font-family:'Boogaloo',cursive;
  background:rgba(0,0,0,0.5);
  border:2px solid rgba(0,221,255,0.3); color:var(--gold);
  width:60px; height:50px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  box-shadow:2px 2px 0 rgba(0,0,0,0.4); flex-shrink:0;
  transition:background 0.08s;
}
.ctrl-btn.pressed { background:rgba(0,221,255,0.2); border-color:var(--gold); }
.ctrl-info { text-align:center; flex:1; }
.ctrl-score { font-size:1.4rem; color:var(--gold); text-shadow:0 0 8px rgba(255,215,0,0.4); }
.ctrl-level { font-family:'Share Tech Mono',monospace; font-size:0.4rem;
  letter-spacing:0.15em; color:rgba(0,221,255,0.45); }
</style>
</head>
<body>

<header>
  <div class="logo">NEBULOSA RUSH
    <span class="logo-sub">STARLANE ARCADE · CRUZA LA NEBULOSA</span>
  </div>
  <div class="hud">
    <div class="hud-box"><span class="hud-label">RÉCORD</span><span class="hud-val" id="hi-el">0</span></div>
    <div class="hud-box"><span class="hud-label">ESCUDOS</span><span class="hud-val" id="lives-el">❤❤❤</span></div>
  </div>
</header>

<div id="canvas-wrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <div class="ov-icon">🚀</div>
    <div class="ov-title" id="ov-title">NEBULOSA RUSH</div>
    <div class="ov-sub"   id="ov-sub">STARLANE ARCADE · ESQUIVA Y CRUZA</div>
    <div class="ov-stats" id="ov-stats">
      <div class="ov-stat"><span class="ov-stat-num" id="ov-score">0</span><span class="ov-stat-label">ENERGÍA</span></div>
      <div class="ov-stat"><span class="ov-stat-num" id="ov-crosses">0</span><span class="ov-stat-label">PORTALES</span></div>
    </div>
    <button class="ov-btn" onclick="startGame()">▶ DESPEGAR</button>
    <div class="ov-hint">← → MOVER · ↑ ACELERAR · ↓ FRENAR</div>
  </div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="btn-left"
    ontouchstart="pressKey('left')"  ontouchend="releaseKey('left')"
    onmousedown="pressKey('left')"   onmouseup="releaseKey('left')" onmouseleave="releaseKey('left')">◀</button>
  <button class="ctrl-btn" id="btn-up"
    ontouchstart="pressKey('up')"    ontouchend="releaseKey('up')"
    onmousedown="pressKey('up')"     onmouseup="releaseKey('up')"   onmouseleave="releaseKey('up')">▲</button>
  <div class="ctrl-info">
    <div class="ctrl-score" id="score-el">0</div>
    <div class="ctrl-level" id="level-el">NEBULA 1</div>
  </div>
  <button class="ctrl-btn" id="btn-down"
    ontouchstart="pressKey('down')"  ontouchend="releaseKey('down')"
    onmousedown="pressKey('down')"   onmouseup="releaseKey('down')" onmouseleave="releaseKey('down')">▼</button>
  <button class="ctrl-btn" id="btn-right"
    ontouchstart="pressKey('right')" ontouchend="releaseKey('right')"
    onmousedown="pressKey('right')"  onmouseup="releaseKey('right')" onmouseleave="releaseKey('right')">▶</button>
</div>

<script>
// ════════════════════════════════════════════════════
// CANVAS
// ════════════════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvas-wrap');
let W = 420, H = 420;

function resize() {
  W = Math.min(window.innerWidth, 420);
  H = W;
  canvas.width  = W;
  canvas.height = H;
  wrap.style.width  = W + 'px';
  wrap.style.height = H + 'px';
}
resize();
window.addEventListener('resize', resize);

let hiScore = parseInt(localStorage.getItem('nebularush_hi') || '0');
document.getElementById('hi-el').textContent = hiScore;

// ════════════════════════════════════════════════════
// CONSTANTS — all relative to W/H
// ════════════════════════════════════════════════════
const ROAD_W   = () => W * 0.36;
const CX       = () => W * 0.5;
const CY       = () => H * 0.5;
const LANE_W   = () => ROAD_W() / 3;

const VRD_L   = () => CX() - ROAD_W()/2;
const VRD_R   = () => CX() + ROAD_W()/2;
const HRD_T   = () => CY() - ROAD_W()/2;
const HRD_B   = () => CY() + ROAD_W()/2;

const INT_L   = () => VRD_L();
const INT_R   = () => VRD_R();
const INT_T   = () => HRD_T();
const INT_B   = () => HRD_B();

// ════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════
let state = 'start';
let score = 0, crosses = 0, lives = 3, level = 1;
let frameCount = 0, animId = null;
let trafficCars = [];
let particles   = [];
let keys = {};
let player = {};
let scorePopups = [];
let shakeTimer = 0;
let invincible = 0;
let dashTimer = 0;
let crossCooldown = 0;

// ════════════════════════════════════════════════════
// SHIP COLORS (cosmic palette)
// ════════════════════════════════════════════════════
const SHIP_COLORS = [
  {body:'#4488ff',shine:'#88ccff',shadow:'#112266',roof:'#2266cc'},
  {body:'#ff3366',shine:'#ff6699',shadow:'#661122',roof:'#cc2255'},
  {body:'#22cc88',shine:'#66ffaa',shadow:'#116633',roof:'#118844'},
  {body:'#ffaa22',shine:'#ffdd66',shadow:'#664411',roof:'#cc7711'},
  {body:'#cc88ff',shine:'#eebbff',shadow:'#441166',roof:'#7722aa'},
  {body:'#00ccff',shine:'#66eeff',shadow:'#004466',roof:'#0088aa'},
];

// ════════════════════════════════════════════════════
// PLAYER INIT
// ════════════════════════════════════════════════════
function initPlayer() {
  const lw = LANE_W();
  player = {
    x:   CX() - lw*0.4,
    y:   H * 0.82,
    w:   lw * 0.62,
    h:   lw * 0.95,
    vx:  0,
    vy:  0,
    speed: W * 0.004,
    color: SHIP_COLORS[0],
    alive: true,
    angle: 0,
    crosses: 0,
    engineRev: 0,
  };
}

// ════════════════════════════════════════════════════
// LEVEL CONFIG
// ════════════════════════════════════════════════════
function getLevelConfig(lvl) {
  return {
    hSpeed: W * (0.0018 + lvl * 0.0006),
    vSpeed: H * (0.0016 + lvl * 0.0005),
    hDensity: Math.min(0.008 + lvl*0.001, 0.018),
    vDensity: Math.min(0.005
